<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Quake Ready — earthquake and tsunami survival game">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ECDE8"/><stop offset="1" stop-color="#DFF2F8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7BC9CF"/><stop offset="1" stop-color="#2E8F94"/>
    </linearGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A87B52"/><stop offset="1" stop-color="#7A563B"/>
    </linearGradient>
    <linearGradient id="mantle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2622A"/><stop offset="1" stop-color="#F0A03C"/>
    </linearGradient>
  </defs>
  <rect width="640" height="180" fill="url(#sky)"/>
  <circle cx="560" cy="52" r="26" fill="#FFD95C"/>
  <ellipse cx="140" cy="52" rx="38" ry="14" fill="#fff" opacity=".9"/>
  <ellipse cx="180" cy="60" rx="26" ry="10" fill="#fff" opacity=".9"/>
  <!-- crust + mantle -->
  <path d="M0 220 L0 180 260 180 280 168 640 168 640 400 0 400 Z" fill="url(#crust)"/>
  <rect y="330" width="640" height="70" fill="url(#mantle)"/>
  <line x1="0" y1="330" x2="640" y2="330" stroke="#FFDCAA" stroke-width="2" stroke-dasharray="8 7" opacity=".6"/>
  <!-- sea with tsunami hump -->
  <path d="M0 180 C60 180 90 130 140 130 C190 130 210 168 280 168 L280 190 C180 205 100 220 0 220 Z" fill="url(#sea)"/>
  <path d="M0 180 C60 180 90 130 140 130 C190 130 210 168 280 168" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  <!-- town -->
  <rect x="300" y="128" width="42" height="40" rx="4" fill="#F2E3C8"/>
  <path d="M296 128 L321 110 346 128 Z" fill="#D6653B"/>
  <rect x="360" y="98" width="36" height="70" rx="4" fill="#CBD6DE"/>
  <rect x="414" y="118" width="56" height="50" rx="4" fill="#FFFFFF"/>
  <rect x="436" y="132" width="14" height="5" fill="#E05A4E"/><rect x="440.5" y="127.5" width="5" height="14" fill="#E05A4E"/>
  <rect x="490" y="124" width="48" height="44" rx="4" fill="#F5D9A8"/>
  <path d="M486 124 L514 106 542 124 Z" fill="#C97F3B"/>
  <g fill="#5FA653">
    <circle cx="576" cy="142" r="14"/><circle cx="566" cy="152" r="9"/><circle cx="586" cy="152" r="9"/>
  </g>
  <rect x="573" y="150" width="6" height="18" fill="#8A6647"/>
  <!-- fault + waves + focus -->
  <path d="M420 168 L404 220 424 268 408 316" fill="none" stroke="#3E2B1C" stroke-width="6" stroke-linecap="round"/>
  <g fill="none" stroke-linecap="round">
    <circle cx="414" cy="244" r="34" stroke="#FFE28A" stroke-width="4"/>
    <circle cx="414" cy="244" r="58" stroke="#FFE28A" stroke-width="3" opacity=".65"/>
    <circle cx="414" cy="244" r="84" stroke="#FF8A50" stroke-width="5" opacity=".8"/>
    <circle cx="414" cy="244" r="112" stroke="#FF8A50" stroke-width="4" opacity=".45"/>
  </g>
  <circle cx="414" cy="244" r="10" fill="#EE6A1F" stroke="#FFD24A" stroke-width="4"/>
  <line x1="414" y1="232" x2="414" y2="176" stroke="#fff" stroke-width="3" stroke-dasharray="6 6" opacity=".8"/>
  <path d="M402 176 h24 l-12 16 Z" fill="#E05A4E"/>
</svg>
