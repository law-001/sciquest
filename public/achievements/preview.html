<title>SciQuest achievement collection</title>
<style>
body{background:#fafaf9;color:#292524;font:14px system-ui;margin:32px}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px}
figure{margin:0;text-align:center;padding:20px;background:#fff;border:1px solid #e7e5e4;border-radius:16px}
img{width:128px;height:128px;object-fit:contain}
figcaption{margin-top:12px;font-weight:650}h1{font-size:28px}
@media(prefers-color-scheme:dark){body{background:#1c1917;color:#fafaf9}figure{background:#292524;border-color:#44403c}}
</style>
